version: '3.8'

services:
  client:
    build:
      context: ./roman-numerals-client
      dockerfile: Dockerfile
      args:
        # When running in Docker, use the server service name
        REACT_APP_API_URL: http://server:8080
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://server:8080
    depends_on:
      - server
    networks:
      - app-network

  server:
    build:
      context: ./roman-numerals-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge