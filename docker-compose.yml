version: '3.8'

services:
  client:
    build:
      context: ./roman-numerals-client
      dockerfile: Dockerfile
      args:
        # For local development, use localhost
        # For Play with Docker, replace with your PWD URL
        REACT_APP_API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${API_URL:-http://localhost:8080}
    depends_on:
      - server

  server:
    build:
      context: ./roman-numerals-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080